name: build-pr

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  queue: max

jobs:
  build:
    # This runs code from the PR with a token that can push to the repository,
    # so only preview branches pushed to this repository by people who already
    # have write access. Pull requests from forks get no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Node modules
        run: npm install
      - name: Eleventy
        run: |
          cp -f _data/site.json /tmp/site.json
          jq '.base_url = "https://igalia.github.io"' \
            /tmp/site.json > _data/site.json
          npx eleventy \
            --output="_site/pr-${PR_NUMBER}" \
            --pathprefix="/wpewebkit.org/pr-${PR_NUMBER}"
          LC_TIME=C date > "_site/pr-${PR_NUMBER}/.stamp"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
      - name: Add deploy link
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const marker = '\n\n----\n\nSite preview: ';
            const url = `https://igalia.github.io/wpewebkit.org/pr-${pr.number}/`;
            const body = pr.body || '';

            // Replace a link added before (possibly an old branch-named one),
            // allowing for CRLF line endings from the web editor.
            const existing = /(\r?\n\r?\n----\r?\n\r?\nSite preview: )\S+/;
            const newBody = existing.test(body)
              ? body.replace(existing, (match, prefix) => prefix + url)
              : body + marker + url;
            if (newBody == body)
              return;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
